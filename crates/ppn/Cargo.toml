[package]
name = "ppn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pepino-app = { path = "../pepino-app" }
pepino-sync = { path = "../pepino-sync" }
pepino-node = { path = "../pepino-node" }
pepino-core = { path = "../pepino-core" }
blake3 = "1"
futures-util.workspace = true
nix = { version = "0.29", features = ["term", "fs", "process", "signal"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hex = "0.4"
url = "2"
strsim = "0.11"
toml = { version = "1.1", default-features = false, features = ["parse", "std"] }

terminal_size = "0.4"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros", "signal"] }
unicode-segmentation = "1"
unicode-width = "0.2"
tempfile = "3"

[dev-dependencies]
sqlx.workspace = true
pepino-store = { path = "../pepino-store" }

