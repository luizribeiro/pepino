[workspace]
members = ["crates/pepino-app", "crates/pepino-core", "crates/pepino-node", "crates/pepino-store", "crates/pepino-sync", "crates/ppn"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
p2panda = "=0.8.1"
p2panda-auth = "=0.8.1"
p2panda-blobs = "=0.8.1"
p2panda-core = "=0.8.1"
p2panda-discovery = "=0.8.1"
p2panda-encryption = "=0.8.1"
p2panda-net = "=0.8.1"
p2panda-spaces = "=0.8.1"
p2panda-store = "=0.8.1"
p2panda-stream = "=0.8.1"
p2panda-sync = "=0.8.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
