[workspace]
members = ["crates/pepino-core", "crates/pepino-node", "crates/pepino-store", "crates/ppn"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 1
